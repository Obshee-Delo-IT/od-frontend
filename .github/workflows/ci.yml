name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Opt JavaScript actions into the Node 24 runtime ahead of the
# 2026-06-16 default flip. Drop this once all `actions/*` versions
# we pin natively run on Node 24.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci:
    name: lint · type-check · test · build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Next route types
        run: pnpm next typegen

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Test
        run: pnpm test

      - name: Build
        # No WP_* env here on purpose — Coolify owns the real deploy
        # secrets. The httpClient stub kicks in when env is missing so
        # the build still validates compilation + RSC boundaries.
        run: pnpm build

  image:
    name: image → GHCR → Coolify (stage)
    # Only after the gate above is green, and only for main: a red commit must
    # never reach a deployed tier. The prod tier is the same workflow, dispatched
    # by hand — see `deploy.yml`.
    needs: ci
    if: github.ref == 'refs/heads/main'
    # A called workflow cannot elevate its own token: `deploy.yml` asks for
    # `packages: write` to push to GHCR, and a reusable workflow only ever gets
    # what the calling job already holds. Without this block the caller falls
    # back to the repository's default permissions, the request exceeds them,
    # and the whole run is rejected before a single job starts — `startup_failure`
    # with zero jobs and no log to read. Keep this in step with `deploy.yml`.
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy.yml
    with:
      tier: stage
    secrets: inherit
