apis:
  wp@v2.0.0:
    # od-wp, the WordPress that serves production after cutover — the install
    # the shipped types must describe. od-stage was that install until
    # 2026-09-12; it is a rehearsal clone with a wider plugin set, and od-dev is
    # the development backend but not the source of truth. `pnpm generate:types
    # -- --from <url>` overrides this without editing the file.
    root: https://wp.obshee-delo.ru/wp-json-openapi
    x-openapi-ts:
      output: ./src/types/generated/wp-json-openapi.ts
